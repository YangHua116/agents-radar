name: Daily Agents Radar

on:
  schedule:
    # 每天 00:00 UTC = 08:00 CST (UTC+8)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the current reports to Pages without calling the LLM
        required: false
        default: false
        type: boolean
      create_issues:
        description: Create GitHub Issues for generated reports
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  copilot-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Web content fetching adds ~60-120 s of HTTP requests on incremental runs;
    # the first-ever run (fetching up to 16 articles plus RSS) may need up to 20 min.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ inputs.deploy_only != true }}
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: ${{ inputs.deploy_only != true }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ inputs.deploy_only != true }}
        run: pnpm install --frozen-lockfile

      - name: Install GitHub Copilot CLI
        if: ${{ inputs.deploy_only != true }}
        run: npm install -g @github/copilot@latest

      - name: Run daily digest
        if: ${{ inputs.deploy_only != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: github-copilot-cli
          GITHUB_COPILOT_CLI_MODEL: auto
          COPILOT_MAX_AI_CREDITS: "30"
          LLM_CONCURRENCY: 2
          LLM_MAX_OUTPUT_TOKENS: 4000
          REPORT_LANGUAGES: zh
          CORE_REPORTS_ENABLED: "false"
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ (github.event_name != 'workflow_dispatch' || inputs.create_issues) && github.repository || '' }}
        run: pnpm start

      - name: Commit digest files
        if: ${{ inputs.deploy_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        if: ${{ inputs.deploy_only != true }}
        env:
          PAGES_URL: https://yanghua116.github.io/agents-radar
        run: pnpm manifest

      - name: Commit manifest and feed
        if: ${{ inputs.deploy_only != true }}
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        if: ${{ inputs.deploy_only != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://yanghua116.github.io/agents-radar
        run: pnpm notify

      - name: Send Feishu notification
        if: ${{ inputs.deploy_only != true }}
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://yanghua116.github.io/agents-radar
        run: pnpm notify:feishu

      - name: Close stale issues
        if: ${{ inputs.deploy_only != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html manifest.json feed.xml _site/
          cp -R digests _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: digest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
