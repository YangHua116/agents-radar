# agents-radar configuration
# Edit this file to customize which repositories are tracked.
# Changes take effect on the next workflow run.

# ── AI CLI tools ──────────────────────────────────────────────────────────────
# Tracked for per-tool digests and cross-tool comparison.
# Each entry requires: id (filename slug), repo (owner/repo), name (display name).
# Set paginated: true for high-volume repos with many daily updates.

cli_repos:
  - id: claude-code
    repo: anthropics/claude-code
    name: Claude Code
  - id: codex
    repo: openai/codex
    name: OpenAI Codex
  - id: gemini-cli
    repo: google-gemini/gemini-cli
    name: Gemini CLI
  - id: copilot-cli
    repo: github/copilot-cli
    name: GitHub Copilot CLI
  - id: kimi-cli
    repo: MoonshotAI/kimi-cli
    name: Kimi Code CLI
  - id: opencode
    repo: anomalyco/opencode
    name: OpenCode
  - id: pi
    repo: badlogic/pi-mono
    name: Pi
  - id: qwen-code
    repo: QwenLM/qwen-code
    name: Qwen Code
  - id: deepseek-tui
    repo: Hmbown/DeepSeek-TUI
    name: DeepSeek TUI
  - id: grok-build
    repo: xai-org/grok-build
    name: Grok Build

# ── Claude Code Skills ────────────────────────────────────────────────────────
# Tracked separately without a date filter, sorted by community engagement.

skills_repo: anthropics/skills

# ── OpenClaw (primary focus project) ─────────────────────────────────────────
# Tracked with a dedicated deep-dive report. Set paginated: true for high-volume repos.

openclaw:
  id: openclaw
  repo: openclaw/openclaw
  name: OpenClaw
  paginated: true

# ── OpenClaw peer projects ────────────────────────────────────────────────────
# Tracked alongside OpenClaw for cross-ecosystem comparison.

openclaw_peers:
  - id: nanobot
    repo: HKUDS/nanobot
    name: NanoBot
    paginated: true
  - id: hermes-agent
    repo: nousresearch/hermes-agent
    name: Hermes Agent
  - id: picoclaw
    repo: sipeed/picoclaw
    name: PicoClaw
    paginated: true
  - id: nanoclaw
    repo: qwibitai/nanoclaw
    name: NanoClaw
  - id: nullclaw
    repo: nullclaw/nullclaw
    name: NullClaw
  - id: ironclaw
    repo: nearai/ironclaw
    name: IronClaw
  - id: lobsterai
    repo: netease-youdao/LobsterAI
    name: LobsterAI
  - id: moltis
    repo: moltis-org/moltis
    name: Moltis
  - id: copaw
    repo: agentscope-ai/CoPaw
    name: CoPaw
  - id: zeptoclaw
    repo: qhkm/zeptoclaw
    name: ZeptoClaw
  - id: zeroclaw
    repo: zeroclaw-labs/zeroclaw
    name: ZeroClaw

# ── AI infrastructure ─────────────────────────────────────────────────────────
# Inference engines, gateways and fine-tuning frameworks that the agent/CLI
# layer runs on top of. Tracked in a dedicated ai-infra report.

infra_repos:
  - id: vllm
    repo: vllm-project/vllm
    name: vLLM
    paginated: true
  - id: sglang
    repo: sgl-project/sglang
    name: SGLang
    paginated: true
  - id: llama-cpp
    repo: ggml-org/llama.cpp
    name: llama.cpp
    paginated: true
  - id: ollama
    repo: ollama/ollama
    name: Ollama
  - id: litellm
    repo: BerriAI/litellm
    name: LiteLLM
    paginated: true
  - id: unsloth
    repo: unslothai/unsloth
    name: Unsloth
    paginated: true

# ── GitHub topic discovery ───────────────────────────────────────────────────
# Repositories updated in the last seven days are ranked by stars. Keep labels
# short: they are included in the report as the discovery source.

trending_queries:
  - query: topic:llm
    label: llm
  - query: topic:ai-agent
    label: agent
  - query: topic:llm-inference
    label: inference
  - query: topic:llm-evaluation
    label: evaluation
  - query: topic:multimodal
    label: multimodal
  - query: topic:vision-language-model
    label: vlm
  - query: topic:rag
    label: rag
  - query: topic:vector-database
    label: vector-db
  - query: topic:agent-memory
    label: memory
  - query: topic:model-context-protocol
    label: mcp
  - query: topic:mcp-server
    label: mcp-server
  - query: topic:large-language-model
    label: llm-model
  - query: topic:machine-learning
    label: ml

# ── ArXiv research discovery ─────────────────────────────────────────────────
# Covers agents/reasoning/evaluation, multimodal, RAG/memory, robotics and
# speech in addition to the original AI/NLP/ML categories.

arxiv_categories:
  - cs.AI
  - cs.CL
  - cs.LG
  - cs.CV
  - cs.RO
  - stat.ML
  - eess.AS

# ── AI lab and research-team RSS/Atom feeds ──────────────────────────────────
# The first run takes the latest max_items entries per source; later runs only
# report unseen entries. A failed source does not block the remaining feeds.

rss_feeds:
  - id: deepmind
    name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    tags: [agent, reasoning, multimodal, research]
    max_items: 5
  - id: microsoft-research
    name: Microsoft Research
    url: https://www.microsoft.com/en-us/research/feed/
    tags: [agent, evaluation, multimodal, systems]
    max_items: 5
  - id: nvidia-developer
    name: NVIDIA Developer Blog
    url: https://developer.nvidia.com/blog/feed/
    tags: [inference, multimodal, ai-infra]
    max_items: 5
  - id: apple-ml
    name: Apple Machine Learning Research
    url: https://machinelearning.apple.com/rss.xml
    tags: [multimodal, on-device, research]
    max_items: 5
  - id: bair
    name: Berkeley AI Research
    url: https://bair.berkeley.edu/blog/feed.xml
    tags: [agent, reasoning, multimodal, robotics]
    max_items: 5
  - id: mit-ai
    name: MIT AI News
    url: https://news.mit.edu/rss/topic/artificial-intelligence2
    tags: [research, evaluation, multimodal]
    max_items: 5
